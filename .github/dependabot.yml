version: 2
updates:
    # Frontend / Node dependencies (package.json via pnpm)
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Madrid'
      open-pull-requests-limit: 5
      labels:
          - 'dependencies'
          - 'automated'
      # Group minor/patch dev-dependencies into a single PR to reduce noise
      groups:
          dev-dependencies:
              dependency-type: 'development'
              update-types:
                  - 'minor'
                  - 'patch'
          test-tooling:
              patterns:
                  - 'vitest*'
                  - '@vitest/*'
                  - '@playwright/test'
                  - '@testing-library/*'
              update-types:
                  - 'minor'
                  - 'patch'
      ignore:
          # Hold React major until full compatibility verified
          - dependency-name: 'react'
            update-types: ['version-update:semver-major']
          - dependency-name: 'react-dom'
            update-types: ['version-update:semver-major']
          # Hold React Router major — v7 has breaking changes
          - dependency-name: 'react-router-dom'
            update-types: ['version-update:semver-major']
          # Pinned to match the managed runtime's pre-installed Chromium; a
          # newer minor expects a browser build that is not available there.
          - dependency-name: '@playwright/test'
          # eslint-plugin-react-refresh 0.5.0 cambió su peerDependency de
          # `eslint: >=8.40` a `eslint: ^9 || ^10`. Con ESLint 8.57.1 el plugin
          # no llega a registrar sus reglas y `.eslintrc.cjs` deja 184
          # referencias huérfanas a `react-refresh/only-export-components`
          # ("Definition for rule ... was not found"), que tumban `pnpm lint`.
          # En un paquete 0.x un salto de minor es breaking, y el grupo
          # dev-dependencies agrupa minors, así que sin este ignore vuelve a
          # colarse en cada tanda. Levantarlo requiere migrar a ESLint 9 +
          # flat config; tarea registrada en BACKLOG.md (Deuda Técnica).
          - dependency-name: 'eslint-plugin-react-refresh'
            update-types:
                ['version-update:semver-major', 'version-update:semver-minor']

    # GitHub Actions versions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Madrid'
      labels:
          - 'dependencies'
          - 'github-actions'

# NOTE: Supabase Edge Functions (supabase/functions/) use Deno with direct URL
# imports (e.g. npm:openai@6.33.0). Dependabot does not support Deno import maps
# without a deno.json lockfile. These dependencies must be updated manually.
# Tracked in BACKLOG.md under "Deno dependency management".
